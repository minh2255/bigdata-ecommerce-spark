x-spark-common: &spark-common
  build: .
  image: bigdata-spark:3.5.9
  user: root
  volumes:
    - ./data:/data
    - ./jobs:/opt/jobs
    - ./scripts:/opt/scripts
  environment:
    - DATA_DIR=/data

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # cổng submit job
      - "4040:4040"   # Spark Application UI (chỉ có khi job đang chạy)

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - DATA_DIR=/data
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g   # máy 8GB RAM: đổi thành 1g
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - DATA_DIR=/data
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g   # máy 8GB RAM: đổi thành 1g
    ports:
      - "8082:8081"
